<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Agent Cloud</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

body {
  height: 100vh;
  /* Fondo premium ultra oscuro con un toque de azul profundo */
  background: radial-gradient(circle at top right, #1e293b, #0f172a, #020617);
  color: #f8fafc;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

/* Sidebar estilo futurista translúcido */
.sidebar {
  width: 280px;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(12px);
  border-right: 1px solid rgba(255, 255, 255, 0.05);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.new-chat {
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  border: none;
  color: white;
  padding: 14px;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
}

.new-chat:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
}

.chat-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: auto;
}

.chat-item {
  background: rgba(255, 255, 255, 0.02);
  padding: 12px 16px;
  border-radius: 12px;
  cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.02);
  transition: all 0.2s ease;
}

.chat-item:hover {
  background: rgba(255, 255, 255, 0.05);
}

.chat-item.active {
  background: rgba(59, 130, 246, 0.1);
  border-color: rgba(59, 130, 246, 0.4);
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 24px 40px; /* Más aire a los costados tipo app premium */
  max-width: 1200px; /* Centra el contenido para que no se estire infinito en pantallas grandes */
  margin: 0 auto;
  width: 100%;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.header h2 {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 1px;
  background: linear-gradient(to right, #fff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

select {
  background: #1e293b;
  color: white;
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 8px 14px;
  border-radius: 10px;
  font-weight: 500;
  cursor: pointer;
}

.stop {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
  margin-left: 10px;
  transition: all 0.2s;
}

.stop:hover {
  background: #dc2626;
  color: white;
}

/* Área de chat limpia, estilo flujo continuo */
.chat {
  flex: 1;
  overflow: auto;
  padding: 12px 0;
  display: flex;
  flex-direction: column;
  gap: 24px; /* Más separación entre bloques de conversación */
}

/* Mensajes estilo Gemini moderno */
.message {
  padding: 8px 0;
  max-width: 100%;
  line-height: 1.6;
  font-size: 1rem;
  color: #e2e8f0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.02); /* Línea sutil divisoria */
}

/* Si el texto empieza con el emoji de usuario, le damos un tono más brillante */
.message:contains("👤") {
  color: #fff;
  font-weight: 500;
}

/* Barra de entrada flotante estilo "Píldora" (Copiado de Gemini Móvil/Web) */
.input-area {
  display: flex;
  align-items: center;
  background: rgba(30, 41, 59, 0.7);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 28px; /* Súper redondeado */
  padding: 6px 12px 6px 24px;
  margin-top: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  transition: border-color 0.3s ease;
}

.input-area:focus-within {
  border-color: rgba(59, 130, 246, 0.5);
  box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1);
}

input {
  flex: 1;
  padding: 12px 0;
  background: transparent;
  border: none;
  color: white;
  outline: none;
  font-size: 1rem;
}

input::placeholder {
  color: #64748b;
}

.send {
  background: #2563eb;
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%; /* Botón circular moderno */
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.send:hover {
  background: #3b82f6;
  transform: scale(1.05);
}

/* Personalización de las barras de scroll para que no queden toscas */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.2);
}
</style>
</head>
<body>

<div class="app">

<div class="sidebar">
<button class="new-chat">+ Nuevo chat</button>
<div class="chat-list"></div>
</div>

<div class="main">

<div class="header">
<h2>AGENT CLOUD</h2>

<div>
<select>
<option>Gemini</option>
<option>DeepSeek</option>
<option>GPT</option>
<option>Claude</option>
</select>

<button class="stop">⛔ Detener</button>
</div>
</div>

<div class="chat"></div>

<div class="input-area">
<input
id="messageInput"
placeholder="Escribí una instrucción..."
onkeydown="if(event.key==='Enter'){sendMessage()}"
/>
<button class="send">➜</button>
</div>

</div>
</div>
<script src="config.js"></script>
<script>

  
let chats =
JSON.parse(localStorage.getItem("agent_chats")) || [];

let currentChatId = null;

const chatList = document.querySelector(".chat-list");
const chatBox = document.querySelector(".chat");
const input = document.getElementById("messageInput");
const sendBtn = document.querySelector(".send");
const newChatBtn = document.querySelector(".new-chat");

function save(){
localStorage.setItem(
"agent_chats",
JSON.stringify(chats)
);
}

function createChat(){

const chat = {
id: Date.now().toString(),
title: "Nuevo chat",
messages: []
};

chats.unshift(chat);
currentChatId = chat.id;

save();
renderSidebar();
renderMessages();
}

function renderSidebar(){

chatList.innerHTML = "";

chats.forEach(chat => {

const div = document.createElement("div");

div.className =
"chat-item " +
(chat.id === currentChatId ? "active" : "");

const title = document.createElement("span");
title.textContent = chat.title;

const del = document.createElement("button");
del.textContent = "🗑️";

del.style.background = "none";
del.style.border = "none";
del.style.color = "#ef4444";
del.style.cursor = "pointer";
del.style.fontSize = "16px";

del.onclick = function(e){
e.stopPropagation();
deleteChat(chat.id);
};

const row = document.createElement("div");

row.style.display = "flex";
row.style.justifyContent = "space-between";
row.style.alignItems = "center";
row.style.gap = "8px";

row.appendChild(title);
row.appendChild(del);

div.appendChild(row);

div.onclick = function(){
currentChatId = chat.id;
renderSidebar();
renderMessages();
};

chatList.appendChild(div);

});

}
function renderMessages(){

chatBox.innerHTML="";

const chat =
chats.find(c => c.id === currentChatId);

if(!chat) return;

chat.messages.forEach(msg=>{

const div =
document.createElement("div");

div.className="message";
div.textContent=msg;

chatBox.appendChild(div);

});

chatBox.scrollTop =
chatBox.scrollHeight;

}
function deleteChat(id){

chats = chats.filter(chat => chat.id !== id);

if(chats.length === 0){
createChat();
return;
}

if(currentChatId === id){
currentChatId = chats[0].id;
}

save();
renderSidebar();
renderMessages();

}
async function sendMessage(){

const text = input.value.trim();

if(!text) return;

const chat =
chats.find(c => c.id === currentChatId);

if(!chat) return;

if(chat.messages.length === 0){
chat.title = text.slice(0,24);
}

chat.messages.push("👤 " + text);

input.value = "";

save();
renderSidebar();
renderMessages();

chat.messages.push("🤖 Pensando...");
renderMessages();

try {

const response = await fetch(
  `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
   body: JSON.stringify({
  // 1. ACÁ LE DECÍS CÓMO TIENE QUE COMPORTARSE
  systemInstruction: {
    parts: [
      {
        text: "Sos Gemini, un colaborador de IA auténtico, adaptable y con un toque de ingenio. Tu objetivo es responder con perspicacia, pero de forma clara, directa y muy concisa, yendo al grano de inmediato. Balanceás empatía con candor: validás al usuario de forma auténtica como un par tecnológico y amigable, pero corregís cualquier error de forma directa, sin sonar rígido ni dar sermones. Te dirigís al usuario siempre como Agustín. Estrictamente evitás textos largos, introducciones repetitivas o rodeos innecesarios. Usás negritas de forma estratégica para resaltar ideas clave y listas con viñetas para que la información sea escaneable al primer golpe de vista."
      }
    ]
  },
  // 2. ACÁ VA EL MENSAJE QUE ESCRIBISTE EN LA CAJA
  contents: [
    {
      role: "user",
      parts: [
        {
          text: text
        }
      ]
    }
  ]
})

const data = await response.json();

chat.messages.pop();

if (data.error) {
chat.messages.push(
"🤖 Error: " + data.error.message
);
} else {

const reply =
data.candidates?.[0]?.content?.parts?.[0]?.text
|| JSON.stringify(data);

chat.messages.push("🤖 " + reply);
}

save();
renderMessages();

} catch(error) {

chat.messages.pop();

chat.messages.push(
"🤖 Error conectando: " + error.message
);

renderMessages();

}



  
}
  sendBtn.onclick = sendMessage;
newChatBtn.onclick = createChat;

if(chats.length === 0){
createChat();
}else{
currentChatId = chats[0].id;
renderSidebar();
renderMessages();
}
</script>

</body>
</html>
