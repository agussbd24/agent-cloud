<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Agent Cloud</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,system-ui,sans-serif;
}

body{
height:100vh;
background:linear-gradient(180deg,#0b0f14,#111827);
color:white;
overflow:hidden;
}

.app{
display:flex;
height:100vh;
}

.sidebar{
width:280px;
background:rgba(255,255,255,.03);
border-right:1px solid rgba(255,255,255,.06);
padding:18px;
display:flex;
flex-direction:column;
gap:12px;
}

.new-chat{
background:#2563eb;
border:none;
color:white;
padding:14px;
border-radius:14px;
cursor:pointer;
font-weight:600;
}

.chat-list{
display:flex;
flex-direction:column;
gap:10px;
overflow:auto;
}

.chat-item{
background:rgba(255,255,255,.03);
padding:12px;
border-radius:12px;
cursor:pointer;
}

.chat-item.active{
outline:1px solid rgba(59,130,246,.7);
}

.main{
flex:1;
display:flex;
flex-direction:column;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

select{
background:#151b23;
color:white;
border:none;
padding:10px 14px;
border-radius:12px;
}

.stop{
background:#dc2626;
border:none;
color:white;
padding:10px 16px;
border-radius:12px;
cursor:pointer;
}

.chat{
flex:1;
overflow:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:12px;
}

.message{
background:#151b23;
padding:14px;
border-radius:14px;
max-width:75%;
}

.input-area{
display:flex;
gap:12px;
margin-top:16px;
}

input{
flex:1;
padding:16px;
background:#151b23;
border:none;
border-radius:16px;
color:white;
outline:none;
}

.send{
background:#2563eb;
border:none;
color:white;
padding:0 22px;
border-radius:16px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="app">

<div class="sidebar">
<button class="new-chat">+ Nuevo chat</button>
<div class="chat-list"></div>
</div>

<div class="main">

<div class="header">
<h2>AGENT CLOUD</h2>

<div>
<select id="model">
<option>Gemini</option>
<option>DeepSeek</option>
<option>GPT</option>
<option>Claude</option>
</select>

<button class="stop">⛔ Detener</button>
</div>
</div>

<div class="chat"></div>

<div class="input-area">
<input placeholder="Escribí una instrucción..." />
<button class="send">➜</button>
</div>

</div>
</div>

<script>
let chats =
JSON.parse(localStorage.getItem("agent_chats")) || [];

let currentChatId = null;

const chatList = document.querySelector(".chat-list");
const chatBox = document.querySelector(".chat");
const input = document.querySelector("input");
const send = document.querySelector(".send");
const newChatBtn = document.querySelector(".new-chat");

function save(){
localStorage.setItem(
"agent_chats",
JSON.stringify(chats)
);
}

function createChat(){

const chat = {
id: Date.now().toString(),
title: "Nuevo chat",
messages: [],
model: "Gemini"
};

chats.unshift(chat);
currentChatId = chat.id;

save();
renderSidebar();
renderMessages();

}

function renderSidebar(){

chatList.innerHTML = "";

chats.forEach(chat=>{

const div = document.createElement("div");

div.className =
"chat-item " +
(chat.id === currentChatId ? "active":"");

div.textContent = chat.title;

div.onclick = ()=>{
currentChatId = chat.id;
renderSidebar();
renderMessages();
};

chatList.appendChild(div);

});

}

function renderMessages(){

chatBox.innerHTML = "";

const chat =
chats.find(c=>c.id===currentChatId);

if(!chat) return;

chat.messages.forEach(msg=>{

const div = document.createElement("div");

div.className="message";

div.textContent=msg;

chatBox.appendChild(div);

});

}

send.onclick = ()=>{

const text = input.value.trim();

if(!text) return;

const chat =
chats.find(c=>c.id===currentChatId);

if(chat.messages.length===0){
chat.title = text.slice(0,24);
}

chat.messages.push(text);

save();
renderSidebar();
renderMessages();

input.value = "";

};

newChatBtn.onclick = createChat;

if(chats.length===0){
createChat();
}else{
currentChatId = chats[0].id;
renderSidebar();
renderMessages();
}
</script>

</body>
</html>
